<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tulip PIE 🌷🥧</title>
<style>
  :root { --ink: #2b1d3a; --cream: #fff8ec; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Trebuchet MS", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--ink); user-select: none; background: #6dbb5c;
  }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  #scene { position: absolute; left: 0; top: 0; width: 1200px; height: 900px; transform-origin: 0 0; cursor: crosshair; }

  /* sky & ground */
  .sky { position: absolute; left: 0; top: 0; width: 1200px; height: 200px;
    background: linear-gradient(#1b1747, #4a2c6e 40%, #c45a7a 72%, #f6a65b); }
  .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle 2.5s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .2; } }
  .moon { position: absolute; left: 1080px; top: 22px; font-size: 44px; }
  .hills { position: absolute; left: 0; top: 130px; width: 1200px; height: 80px; }
  .title {
    position: absolute; left: 0; width: 1200px; top: 18px; text-align: center; color: #fff; pointer-events: none;
    font-size: 64px; font-weight: bold; letter-spacing: .03em; text-shadow: 0 4px 0 #8a3b6b, 0 0 30px rgba(255,200,230,.5);
  }
  .subtitle { position: absolute; left: 0; width: 1200px; top: 100px; text-align: center; color: #fff; opacity: .85; font-size: 18px; pointer-events: none; }
  .ground { position: absolute; left: 0; top: 190px; width: 1200px; height: 710px;
    background: radial-gradient(circle at 20% 30%, #78c766 0 2px, transparent 3px) 0 0/38px 38px, #6dbb5c; }

  /* roads */
  .road { position: absolute; background: #4a4655; }
  .road.h { border-top: 7px solid #d8cfc0; border-bottom: 7px solid #d8cfc0; }
  .road.v { border-left: 7px solid #d8cfc0; border-right: 7px solid #d8cfc0; }
  .road.h::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 2px); height: 4px;
    background: repeating-linear-gradient(90deg, #ffd84a 0 26px, transparent 26px 52px); }
  .road.v::after { content: ""; position: absolute; top: 0; bottom: 0; left: calc(50% - 2px); width: 4px;
    background: repeating-linear-gradient(180deg, #ffd84a 0 26px, transparent 26px 52px); }
  .crossing { position: absolute; background: #4a4655; z-index: 1; }
  .street-sign { position: absolute; background: #2e7d4f; color: #fff; font-size: 12px; font-weight: bold; padding: 2px 7px; border-radius: 4px; border: 2px solid #fff; z-index: 6; pointer-events: none; }

  /* moving things */
  .mover { position: absolute; font-size: 34px; z-index: 5; pointer-events: none; line-height: 1; }
  .flip { display: inline-block; transform: scaleX(-1); }
  @keyframes eastbound { from { left: -70px; } to { left: 1230px; } }
  @keyframes westbound { from { left: 1230px; } to { left: -70px; } }
  @keyframes southbound { from { top: 140px; } to { top: 930px; } }
  @keyframes northbound { from { top: 930px; } to { top: 140px; } }
  @keyframes pace { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(var(--d)); } }
  @keyframes paceflip { 0%, 49% { transform: scaleX(-1); } 50%, 100% { transform: scaleX(1); } }

  /* buildings */
  .bldg { position: absolute; cursor: pointer; z-index: 3; transition: transform .15s, filter .15s; }
  .bldg:hover { transform: translateY(-5px); filter: brightness(1.08) drop-shadow(0 6px 0 rgba(0,0,0,.15)); }
  .roof { position: relative; }
  .roof.peak { clip-path: polygon(50% 0, 100% 100%, 0 100%); margin: 0 -10px; }
  .roof.pediment { clip-path: polygon(50% 0, 100% 100%, 0 100%); margin: 0 -14px; }
  .roof.flat { border-radius: 6px 6px 0 0; margin: 0 -6px; }
  .roof.awning { margin: 0 -10px; border-radius: 0 0 14px 14px; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .walls { position: relative; border: 3px solid rgba(0,0,0,.2); border-top: none; border-radius: 0 0 6px 6px; box-shadow: 0 7px 0 rgba(0,0,0,.18); }
  .walls .sign { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    background: var(--cream); border: 2px solid var(--ink); border-radius: 6px; padding: 2px 8px; font-weight: bold; font-size: 14px; z-index: 2; }
  .walls .big { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 46px; line-height: 1; z-index: 2; }
  .door { position: absolute; bottom: 0; left: 50%; width: 30px; height: 44px; transform: translateX(-50%); background: #6b3f1f; border-radius: 15px 15px 0 0; border: 2px solid rgba(0,0,0,.25); opacity: 0; }
  .win { position: absolute; width: 30px; height: 30px; background: #ffe58a; border: 3px solid rgba(0,0,0,.25); border-radius: 4px; box-shadow: 0 0 14px #ffd84a; top: 42px; }
  .win.l { left: 14px; } .win.r { right: 14px; }
  .tower { position: absolute; left: 50%; transform: translateX(-50%); width: 44px; background: #c94a3f; border: 3px solid rgba(0,0,0,.2); text-align: center; font-size: 22px; }
  .tower::before { content: ""; position: absolute; left: -8px; right: -8px; top: -30px; height: 30px; background: #8a2f27; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .play-tag { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); white-space: nowrap; background: #ffe27a; border: 2px solid var(--ink); border-radius: 999px; font-size: 12px; font-weight: bold; padding: 1px 9px; z-index: 4; }

  /* special places */
  .paddock { position: absolute; z-index: 2; cursor: pointer; border-radius: 10px;
    background: #9ccf6a; border: 6px solid #a0703f; outline: 3px dashed #7a5230; outline-offset: -12px; }
  .pond { position: absolute; z-index: 3; cursor: pointer; border-radius: 50%;
    background: radial-gradient(ellipse at 40% 35%, #ffffff 0 10%, #d9f3ff 30%, #a8dcf5 75%); border: 10px solid #f4fbff; box-shadow: 0 0 0 4px #bfe3f2, 0 8px 0 rgba(0,0,0,.12); transition: filter .15s; }
  .duckpond { background: radial-gradient(ellipse at 40% 35%, #b8ecff 0 15%, #6cc4ef 60%, #4fa9de); border-color: #c9b38a; box-shadow: 0 0 0 4px #a8916a, 0 6px 0 rgba(0,0,0,.12); }
  .pond:hover, .paddock:hover { filter: brightness(1.07); }
  .pond .sign, .paddock .sign { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--cream); border: 2px solid var(--ink); border-radius: 6px; padding: 2px 8px; font-weight: bold; font-size: 14px; z-index: 2; }
  .orbit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; animation: spin linear infinite; }
  .orbit span { position: absolute; font-size: 30px; transform: translate(-50%, -50%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fountain { position: absolute; z-index: 3; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #8fd3ff 0 45%, #c9c1b3 46% 60%, #e7dfd2 61%); display: flex; align-items: center; justify-content: center; font-size: 56px; pointer-events: none; }
  .tree { position: absolute; font-size: 40px; z-index: 2; pointer-events: none; line-height: 1; }
  .welcome { position: absolute; z-index: 3; background: #fff8ec; border: 3px solid #6b3f1f; border-radius: 10px; padding: 8px 12px; text-align: center; font-weight: bold; font-size: 15px; box-shadow: 0 5px 0 rgba(0,0,0,.2); pointer-events: none; }
  .welcome::after { content: ""; position: absolute; left: 50%; bottom: -34px; width: 8px; height: 31px; background: #6b3f1f; transform: translateX(-50%); }

  /* player */
  #player { position: absolute; z-index: 8; font-size: 36px; line-height: 1; transform: translate(-50%, -80%); pointer-events: none; filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); }
  #player.left { transform: translate(-50%, -80%) scaleX(-1); }
  #help {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 40; background: rgba(255,248,236,.92);
    border: 2px solid var(--ink); border-radius: 999px; padding: 6px 16px; font-size: 14px; white-space: nowrap; pointer-events: none;
  }
  @media (max-width: 700px) { #help { font-size: 11px; white-space: normal; text-align: center; width: 92%; border-radius: 14px; } }

  /* modal */
  #modal {
    position: fixed; inset: 0; background: rgba(20, 10, 35, .6); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 14px;
  }
  #modal.hidden { display: none; }
  .panel {
    background: var(--cream); border-radius: 18px; border: 4px solid var(--ink);
    width: min(560px, 100%); max-height: 94vh; overflow: auto; padding: 18px 18px 22px; position: relative;
    box-shadow: 0 12px 0 rgba(0,0,0,.25);
  }
  .panel h2 { margin: 0 34px 10px 0; font-size: 1.35rem; }
  #close {
    position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--ink); background: #ffd1dc; font-size: 18px; cursor: pointer;
  }
  .hint { margin: 0 0 10px; font-size: .95rem; }
  .msg { min-height: 1.4em; font-weight: bold; text-align: center; margin: 10px 0 0; font-size: 1.1rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  button.btn {
    font: inherit; font-weight: bold; padding: 8px 14px; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--ink); background: #ffe27a; box-shadow: 0 3px 0 var(--ink);
  }
  button.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.big { font-size: 1.3rem; padding: 12px 26px; }
  canvas.game { display: block; width: 100%; height: auto; border-radius: 12px; border: 3px solid var(--ink); touch-action: none; }
  .stats { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }

  /* derby */
  .track { background: #c99a5b; border-radius: 12px; border: 3px solid var(--ink); padding: 6px; }
  .lane { position: relative; height: 54px; border-bottom: 2px dashed rgba(255,255,255,.5); }
  .lane:last-child { border-bottom: none; }
  .lane .name { position: absolute; left: 4px; top: 2px; font-size: .7rem; font-weight: bold; color: #fff; }
  .lane .horse { position: absolute; top: 8px; font-size: 38px; transform: scaleX(-1); transition: left .08s linear; }
  .lane .finish { position: absolute; right: 4px; top: 10px; font-size: 30px; }

  /* lemonade */
  .counter { display: flex; gap: 14px; align-items: center; justify-content: center; margin: 6px 0; }
  .customer { font-size: 64px; }
  .bubble { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px; font-size: 1.4rem; min-width: 150px; text-align: center; }
  .cup { text-align: center; font-size: 1.5rem; min-height: 2.2em; background: #fff3b0; border-radius: 10px; padding: 6px; border: 2px dashed var(--ink); }

  /* crayons */
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
  .swatch { width: 30px; height: 44px; border-radius: 6px 6px 3px 3px; border: 2px solid var(--ink); cursor: pointer; clip-path: polygon(50% 0, 100% 22%, 100% 100%, 0 100%, 0 22%); }
  .swatch.on { outline: 3px solid var(--ink); outline-offset: 2px; transform: translateY(-4px); }
  .gallery { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .gallery img { width: 90px; border: 6px solid #b8862b; border-radius: 4px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.25); }

  /* hats */
  .wanted { text-align: center; font-size: 1.2rem; }
  .wanted .big-hat { font-size: 70px; display: block; }
  .hatgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .hatgrid button { font-size: 42px; padding: 10px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; cursor: pointer; }
  .hatgrid button:hover { background: #ffe9f0; }

  /* socks */
  .memgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card {
    aspect-ratio: 1; font-size: 40px; border-radius: 12px; border: 2px solid var(--ink); cursor: pointer;
    background: repeating-linear-gradient(45deg, #9ad0f5 0 10px, #b9e0fb 10px 20px);
  }
  .card.up, .card.done { background: #fff; }
  .card.done { opacity: .55; cursor: default; }

  .panel.wide { width: min(860px, 100%); }
  .mountain { position: absolute; z-index: 3; cursor: pointer; transition: filter .15s, transform .15s; }
  .mountain:hover { filter: brightness(1.1); transform: translateY(-4px); }
  .mountain .peak { position: absolute; inset: 0; background: linear-gradient(#ffffff 0 30%, #9d9fb5 30%, #6f7189);
    clip-path: polygon(0 100%, 30% 40%, 38% 46%, 52% 0, 64% 22%, 72% 16%, 100% 100%); }
  .mountain .sign { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); white-space: nowrap; background: var(--cream);
    border: 2px solid var(--ink); border-radius: 6px; padding: 2px 8px; font-weight: bold; font-size: 14px; }
  .mountain .trike { position: absolute; left: 26%; top: 52%; font-size: 26px; transform: rotate(-35deg); }
  .board { display: grid; grid-template-columns: repeat(8, 1fr); width: min(400px, 100%); aspect-ratio: 1; margin: 0 auto; border: 6px solid #6b3f1f; border-radius: 6px; }
  .sq { border: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
  .sq.light { background: #f3dfb7; cursor: default; } .sq.dark { background: #8a5a3b; }
  .sq.sel { background: #e6b422; } .sq.target { background: #5fae55; box-shadow: inset 0 0 0 3px #fff8; }
  .pc { width: 78%; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -4px 0 rgba(0,0,0,.3), 0 2px 0 rgba(0,0,0,.35); }
  .pc.r { background: radial-gradient(circle at 40% 35%, #ff6b6b, #c4182f); } .pc.b { background: radial-gradient(circle at 40% 35%, #555, #151515); }
  #hud { position: fixed; top: 10px; left: 10px; z-index: 40; display: flex; gap: 8px; pointer-events: none; }
  #hud button { pointer-events: auto; font: inherit; font-weight: bold; font-size: 13px; background: #ffd1d1; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  #hud button.confirm { background: #e8364f; color: #fff; }
  #hud span { background: rgba(255,248,236,.92); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; font-weight: bold; font-size: 14px; }
  .bldg.locked { filter: grayscale(.75) brightness(.85); }
  .bldg.locked::after { content: "🔒"; position: absolute; right: -12px; top: -14px; font-size: 34px; z-index: 5; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
  .bldg.locked:hover { filter: grayscale(.6) brightness(.95); }
  .slot { background: linear-gradient(#ffd84a, #e6a400); border: 4px solid var(--ink); border-radius: 18px; padding: 14px; text-align: center; box-shadow: inset 0 -6px 0 rgba(0,0,0,.2); }
  .reels { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
  .reel { width: 86px; height: 96px; background: #fff; border: 3px solid var(--ink); border-radius: 12px; font-size: 54px; display: flex; align-items: center; justify-content: center; }
  .reel.spinning { filter: blur(1.5px); }
  .wardrobe { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .skin { font: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; cursor: pointer; }
  .skin span { font-size: 32px; } .skin small { font-size: 10px; font-weight: bold; }
  .skin.rare { background: #e3f1ff; } .skin.legendary { background: #fff1c2; } .skin.unowned { opacity: .5; cursor: default; }
  .skin.on { outline: 3px solid #e8364f; outline-offset: 2px; }
  .orchard { background: #8fd06a; border-color: #8a5a3b; }
  .otree { position: absolute; font-size: 38px; line-height: 1; }
  .otree i { position: absolute; font-style: normal; font-size: 14px; left: 14px; top: 16px; transform: rotate(20deg); }
  .studio-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff3c4; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; }
  .studio { display: flex; gap: 8px; align-items: flex-start; }
  .toolbar { display: flex; flex-direction: column; gap: 5px; }
  .tool { font: inherit; font-size: 22px; width: 58px; padding: 3px 0; border-radius: 10px; border: 2px solid var(--ink); background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .tool small { font-size: 9px; font-weight: bold; }
  .tool.on { background: #ffe27a; box-shadow: inset 0 0 0 2px #e8364f; }
  .canvas-wrap { flex: 1; min-width: 0; }
  .swatch.custom { position: relative; overflow: hidden; }
  .swatch.custom input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .stickers { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 6px; }
  .stickers.hidden { display: none; }
  .stk { font-size: 22px; background: #fff; border: 2px solid var(--ink); border-radius: 8px; cursor: pointer; padding: 2px 5px; }
  .stk.on { background: #ffe27a; }
  .sizer { display: flex; align-items: center; gap: 6px; font-weight: bold; }
  .gallery figure { margin: 0; text-align: center; font-size: 11px; width: 130px; }
  .gallery figure img { width: 120px; }
  .tinypiano { position: absolute; z-index: 7; cursor: zoom-in; transition: transform .15s; }
  .tinypiano:hover { transform: scale(1.15); }
  .tp-lid { height: 10px; background: #1d1d1d; border-radius: 5px 5px 0 0; margin: 0 -3px; }
  .tp-keys { position: relative; display: flex; height: 22px; border: 2px solid #1d1d1d; border-top: none; background: #1d1d1d; }
  .tpw { width: 7px; height: 100%; background: #fff; border-right: 1px solid #999; }
  .tpw.down { background: #ffe27a; }
  .tpb { position: absolute; top: 0; width: 4px; height: 12px; background: #111; z-index: 2; border-radius: 0 0 1px 1px; }
  .tpb.down { background: #e8364f; }
  .tp-legs { height: 8px; margin: 0 4px; border-left: 3px solid #1d1d1d; border-right: 3px solid #1d1d1d; }
  .bigkeys { position: relative; height: 230px; background: #1d1d1d; border-radius: 10px; overflow: hidden; border: 4px solid #1d1d1d; user-select: none; touch-action: none; }
  .wk, .bk { position: absolute; top: 0; border: none; padding: 0; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; font: inherit; }
  .wk { height: 100%; background: linear-gradient(#fff, #eee); border-right: 1px solid #bbb; border-radius: 0 0 6px 6px; }
  .bk { height: 60%; background: linear-gradient(#333, #111); z-index: 2; border-radius: 0 0 4px 4px; color: #fff; }
  .wk span, .bk span { font-size: 12px; font-weight: bold; opacity: .55; margin-bottom: 8px; }
  .wk.down { background: #ffe27a; } .bk.down { background: #e8364f; }
  .namebox { font: inherit; padding: 7px 10px; border: 2px solid var(--ink); border-radius: 10px; width: 150px; }
  #rec.recording { background: #ff8a8a; animation: twinkle 1s infinite; }
  .songs { display: grid; gap: 6px; }
  .micbox { display: flex; align-items: center; gap: 5px; font-weight: bold; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; cursor: pointer; }
  .tp-ctrl { display: flex; justify-content: center; gap: 2px; margin-top: 2px; }
  .tp-ctrl button { font: inherit; font-size: 9px; line-height: 1; padding: 2px 3px; border: 1.5px solid var(--ink); border-radius: 5px; background: #ffe27a; cursor: pointer; }
  .tp-ctrl button.on { background: #ff8a8a; animation: twinkle 1s infinite; }
  .tp-idle { position: absolute; left: 50%; top: -16px; font-size: 13px; color: #fff; text-shadow: 0 1px 0 #2b1d3a; animation: bob 2s ease-in-out infinite; pointer-events: none; }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(10deg); } }
  .tp-note { position: absolute; top: 0; font-size: 15px; font-weight: bold; pointer-events: none; animation: floatup 1s ease-out forwards; text-shadow: 0 1px 0 #fff; }
  @keyframes floatup { to { transform: translate(6px, -34px); opacity: 0; } }
  .tp-pop { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); width: 170px; max-height: 150px; overflow: auto; background: var(--cream); border: 2px solid var(--ink); border-radius: 8px; padding: 5px; font-size: 11px; z-index: 9; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  .tp-pop.hidden { display: none; }
  .tp-song { display: flex; align-items: center; gap: 3px; margin-top: 3px; }
  .tp-song span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp-song button { font: inherit; font-size: 10px; padding: 1px 4px; border: 1.5px solid var(--ink); border-radius: 4px; background: #ffe27a; cursor: pointer; }
  .tp-song .tp-del { background: #ffd1d1; } .tp-song .tp-del.confirm { background: #e8364f; color: #fff; }
  .tp-toast { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: #2b1d3a; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .tp-toast.show { opacity: 1; }
  .song { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 5px 8px; flex-wrap: wrap; }
  .song small { opacity: .6; }
  .btn.del { background: #ffd1d1; padding: 4px 9px; }
  .btn.del.confirm { background: #e8364f; color: #fff; }
  .gallery figure .del { margin-top: 4px; font-size: 12px; }
  .secret-wrap { position: relative; }

<body>
<canvas id="fx"></canvas>

    <path d="M0 60 Q150 0 300 45 T600 40 T900 30 T1200 50 V80 H0Z" fill="#4f8f4a"/>
    <path d="M0 70 Q200 30 400 62 T800 55 T1200 62 V80 H0Z" fill="#5fa653"/>
  </svg>
  <div class="title">🌷 Tulip PIE 🥧</div>
  <div class="subtitle">A very real town where nothing is normal</div>

</div>

<div id="modal" class="hidden" role="dialog" aria-modal="true">
  <div class="panel">
    <button id="close" aria-label="Close">✕</button>

<script>
/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const rand = (a, b) => Math.random() * (b - a) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function canvasPos(c, e) {
  const r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height };
}

/* ---------------- fireworks ---------------- */
const fx = $('#fx'), fctx = fx.getContext('2d');
let FW, FH;
function resizeFx() {
  const d = window.devicePixelRatio || 1;
  FW = innerWidth; FH = innerHeight;
  fx.width = FW * d; fx.height = FH * d; fctx.setTransform(d, 0, 0, d, 0, 0);
}
const rockets = [], sparks = [];
function launch(x, y) {
  const sx = x + rand(-40, 40), sy = FH;
  const dist = Math.hypot(x - sx, y - sy) || 1, sp = 12;
  rockets.push({ x: sx, y: sy, px: sx, py: sy, tx: x, ty: y, vx: (x - sx) / dist * sp, vy: (y - sy) / dist * sp, hue: rand(0, 360) });
}
function burst(x, y, hue) {
  const n = 80 + Math.random() * 60;
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(1, 7);
    sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, hue: hue + rand(-25, 25), life: 1, decay: rand(.01, .022) });
  }
}
(function fxLoop() {
  fctx.clearRect(0, 0, FW, FH);
  fctx.globalCompositeOperation = 'lighter';
  fctx.lineCap = 'round';
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.px = r.x; r.py = r.y; r.x += r.vx; r.y += r.vy;
    fctx.strokeStyle = `hsl(${r.hue},100%,75%)`; fctx.lineWidth = 3;
    fctx.beginPath(); fctx.moveTo(r.px - r.vx * 2, r.py - r.vy * 2); fctx.lineTo(r.x, r.y); fctx.stroke();
    if (r.y <= r.ty) { burst(r.tx, r.ty, r.hue); rockets.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.px = p.x; p.py = p.y;
    p.vx *= .97; p.vy = p.vy * .97 + .07; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    fctx.strokeStyle = `hsla(${p.hue},100%,${55 + p.life * 25}%,${p.life})`; fctx.lineWidth = 2.5;
    fctx.beginPath(); fctx.moveTo(p.px - p.vx * 2, p.py - p.vy * 2); fctx.lineTo(p.x, p.y); fctx.stroke();
  }
  fctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(fxLoop);
})();

/* ---------------- save data (coins, key, skins) ---------------- */
const SKINS = [
  { e: '🧒', n: 'Classic Kid', r: 'starter' },
  { e: '🌭', n: 'Hot Dog', r: 'common' }, { e: '🧻', n: 'Tissue Paper', r: 'common' }, { e: '🥔', n: 'Potato', r: 'common' },
  { e: '🍌', n: 'Banana', r: 'common' }, { e: '🧽', n: 'Sponge', r: 'common' }, { e: '🪣', n: 'Bucket', r: 'common' },
  { e: '📻', n: 'Walkie-Talkie', r: 'rare' }, { e: '🦖', n: 'Dino', r: 'rare' }, { e: '🍕', n: 'Pizza Slice', r: 'rare' },
  { e: '🐸', n: 'Froggy', r: 'rare' }, { e: '🤖', n: 'Robot', r: 'rare' },
  { e: '👻', n: 'Ghost', r: 'legendary' }, { e: '🦄', n: 'Unicorn', r: 'legendary' }, { e: '🧟', n: 'Zombie', r: 'legendary' },
];
const save = (() => {
  const d = { coins: 0, key: false, bomb: false, unlimited: false, skins: ['🧒'], skin: '🧒' };
  try { return Object.assign(d, JSON.parse(localStorage.getItem('tulipPIE') || '{}')); } catch (e) { return d; }
})();
document.addEventListener('click', e => {
  const b = e.target.closest('#resetBtn'); if (!b) return;
  if (!b.classList.contains('confirm')) {
    b.classList.add('confirm'); b.textContent = 'Reset ALL progress? Click again';
    setTimeout(() => { if (b.isConnected) { b.classList.remove('confirm'); b.textContent = '🔄 Reset'; } }, 3500);
    return;
  }
  // wipes coins, key, bomb, bank heist, skins and Granny's door. Saved art and piano songs are kept.
  try { localStorage.removeItem('tulipPIE'); } catch (err) {}
  location.reload();
});
function persist() { try { localStorage.setItem('tulipPIE', JSON.stringify(save)); } catch (e) {} updateHud(); }
function updateHud() {
  const hud = document.getElementById('hud');
  if (hud) hud.innerHTML = `<span>🪙 ${save.unlimited ? '∞' : save.coins}</span><span>${save.key ? '🔑 Key found' : '🔑 ???'}</span>${save.bomb ? '<span>💣</span>' : ''}<span>${save.skin}</span><button id="resetBtn" title="Start the whole game over">🔄 Reset</button>`;
  const p = document.getElementById('player'); if (p) p.textContent = save.skin;
  const cas = document.querySelector('[data-key="casino"]');
  if (cas) {
    cas.classList.toggle('locked', !save.key);
    const tag = cas.querySelector('.play-tag'); if (tag) tag.textContent = save.key ? '🎮 Skin Slots' : '🔒 Locked';
  }
}

/* ---------------- tiny synth for the piano ---------------- */
let AC = null, audioUnlocked = false;
function silentWavUrl() {
  // 0.1s of silence; playing it through an <audio> tag makes iPhones ignore the silent switch for web audio
  const n = 2205, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, str) => [...str].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 22050, true); v.setUint32(28, 44100, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function unlockAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== 'running') AC.resume();
    if (!audioUnlocked) {
      audioUnlocked = true;
      const src = AC.createBufferSource(); src.buffer = AC.createBuffer(1, 1, 22050); src.connect(AC.destination); src.start(0);
      const tag = new Audio(silentWavUrl()); tag.setAttribute('playsinline', ''); tag.loop = true; tag.volume = 0.01;
      const pr = tag.play(); if (pr && pr.catch) pr.catch(() => {});
    }
  } catch (e) {}
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
function playNote(midi, dur = 1.4) {
  try {
    unlockAudio();
    const t = AC.currentTime + .005, f = 440 * Math.pow(2, (midi - 69) / 12);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.4, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const o1 = AC.createOscillator(), o2 = AC.createOscillator(), g2 = AC.createGain();
    o1.type = 'triangle'; o1.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = .25;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(AC.destination);
    o1.start(t); o2.start(t); o1.stop(t + dur + .05); o2.stop(t + dur + .05);
  } catch (e) {}
}

/* ---------------- games ---------------- */
const galleryImgs = [];
const games = {

  /* 🐴 Pony Derby */
  stable: { title: '🐴 Hoofbeat Stables: Pony Derby', start(el) {
    const names = ['Sir Neighs-a-Lot (you!)', 'Buttercup', 'Pickles'];
    el.innerHTML = `<p class="hint">You ride <b>Sir Neighs-a-Lot</b> in the top lane. Mash the button (or Space) to gallop!</p>
      <div class="track">${names.map((n, i) => `<div class="lane"><span class="name">${n}</span><span class="horse" id="h${i}">${i === 0 ? '🐎' : '🐴'}</span><span class="finish">🏁</span></div>`).join('')}</div>
      <div class="row"><button class="btn big" id="gallop">Giddy-up!</button></div><p class="msg" id="dmsg"></p>`;
    const horses = [0, 1, 2].map(i => $('#h' + i, el)), msg = $('#dmsg', el), btn = $('#gallop', el);
    let pos, state, iv, cd;
    const draw = () => horses.forEach((h, i) => h.style.left = (Math.min(pos[i], 100) * .82) + '%');
    function countdown() {
      pos = [0, 0, 0]; draw(); state = 'wait'; btn.textContent = 'Giddy-up!';
      let n = 3; msg.textContent = n;
      cd = setInterval(() => { n--; if (n > 0) msg.textContent = n; else { clearInterval(cd); msg.textContent = 'GO!'; state = 'run'; iv = setInterval(tick, 100); } }, 700);
    }
    function tick() { for (let i = 1; i < 3; i++) pos[i] += rand(.12, .78); check(); draw(); }
    function check() {
      const w = pos.findIndex(p => p >= 100);
      if (w < 0) return;
      state = 'done'; clearInterval(iv);
      if (w === 0) { save.coins++; persist(); }
      msg.textContent = w === 0 ? `🏆 Sir Neighs-a-Lot wins! +1 🪙 coin (you have ${save.coins}). Spend it at the casino!` : `${names[w]} won this time. 🥕 Have a carrot and try again!`;
      btn.textContent = 'Race again';
    }
    function gallop() { if (state === 'run') { pos[0] += 2.1; check(); draw(); } else if (state === 'done') countdown(); }
    btn.addEventListener('click', () => { gallop(); btn.blur(); });
    const kh = e => { if (e.code === 'Space') { e.preventDefault(); gallop(); } };
    document.addEventListener('keydown', kh);
    countdown();
    return () => { clearInterval(iv); clearInterval(cd); document.removeEventListener('keydown', kh); };
  }},

  /* ⛸️ Snowflake Catch */
  rink: { title: '⛸️ Frosty Loop Rink: Snowflake Catch', start(el) {
    el.innerHTML = `<p class="hint">Move your skater (mouse, finger, or ← →). Catch ❄️ for 1 point and ⭐ for 5. Dodge the 🐧 penguins!</p>
      <div class="stats"><span id="sc">Score: 0</span><span id="tm">⏱ 30</span></div>
      <canvas class="game" width="480" height="320"></canvas>`;
    const c = $('canvas', el), ctx = c.getContext('2d');
    let x, items, score, timeLeft, last, raf, spawn, over, keys = {};
    function reset() { x = 240; items = []; score = 0; timeLeft = 30; spawn = 0; over = false; last = performance.now(); }
    c.addEventListener('pointermove', e => { x = canvasPos(c, e).x; });
    c.addEventListener('pointerdown', e => { if (over) reset(); x = canvasPos(c, e).x; });
    const kd = e => { keys[e.key] = true; }, ku = e => { keys[e.key] = false; };
    document.addEventListener('keydown', kd); document.addEventListener('keyup', ku);
    function loop(t) {
      const dt = Math.min((t - last) / 1000, .05); last = t;
      if (!over) {
        timeLeft -= dt;
        if (keys.ArrowLeft) x -= 320 * dt;
        if (keys.ArrowRight) x += 320 * dt;
        x = Math.max(20, Math.min(460, x));
        spawn -= dt;
        if (spawn <= 0) {
          spawn = rand(.25, .55);
          const r = Math.random();
          items.push({ x: rand(20, 460), y: -20, v: rand(90, 170), k: r < .1 ? '⭐' : r < .3 ? '🐧' : '❄️' });
        }
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i]; it.y += it.v * dt;
          if (it.y > 268 && it.y < 310 && Math.abs(it.x - x) < 30) {
            score += it.k === '⭐' ? 5 : it.k === '🐧' ? -3 : 1; items.splice(i, 1);
          } else if (it.y > 340) items.splice(i, 1);
        }
        if (timeLeft <= 0) { timeLeft = 0; over = true; }
      }
      const g = ctx.createLinearGradient(0, 0, 0, 320); g.addColorStop(0, '#dff4ff'); g.addColorStop(1, '#a9dcf7');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 480, 320);
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(240, 300, 60 + i * 50, 18 + i * 8, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '28px serif'; items.forEach(it => ctx.fillText(it.k, it.x, it.y));
      ctx.font = '44px serif'; ctx.fillText('⛸️', x, 288);
      if (over) {
        ctx.fillStyle = 'rgba(43,29,58,.75)'; ctx.fillRect(0, 110, 480, 100);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Trebuchet MS';
        ctx.fillText(`Time! You scored ${score}`, 240, 145);
        ctx.font = '18px Trebuchet MS'; ctx.fillText('Click to skate again', 240, 180);
      }
      $('#sc', el).textContent = 'Score: ' + score; $('#tm', el).textContent = '⏱ ' + Math.ceil(timeLeft);
      raf = requestAnimationFrame(loop);
    }
    reset(); raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', kd); document.removeEventListener('keyup', ku); };
  }},

  /* 🍋 Lemonade Rush */
  lemonade: { title: "🍋 Lulu's Lemonade: Lemonade Rush", start(el) {
    el.innerHTML = `<p class="hint">Make each cup exactly how the customer asks, then serve it! You have 45 seconds.</p>
      <div class="stats"><span id="money">💰 $0</span><span id="ltime">⏱ 45</span></div>
      <div class="counter"><span class="customer" id="cust">🧒</span><div class="bubble" id="order"></div></div>
      <div class="cup" id="cup">🥤 empty cup</div>
      <div class="row">
        <button class="btn" data-add="l">+ 🍋 Lemon</button>
        <button class="btn" data-add="s">+ 🍬 Sugar</button>
        <button class="btn" data-add="i">+ 🧊 Ice</button>
      </div>
      <div class="row"><button class="btn" id="dump">🗑️ Dump</button><button class="btn big" id="serve">Serve!</button></div>
      <p class="msg" id="lmsg"></p>`;
    const people = ['🧒', '👵', '🧑‍🚀', '🤠', '🧙', '👨‍🍳', '🦸', '🧛', '👸', '🐶'];
    let order, cup, money, time, iv;
    const icons = { l: '🍋', s: '🍬', i: '🧊' };
    const show = o => ['l', 's', 'i'].map(k => icons[k].repeat(o[k])).join(' ') || 'plain water?';
    function newCustomer() {
      order = { l: Math.floor(rand(1, 4)), s: Math.floor(rand(0, 3)), i: Math.floor(rand(0, 4)) };
      $('#cust', el).textContent = pick(people);
      $('#order', el).textContent = show(order);
      cup = { l: 0, s: 0, i: 0 }; drawCup();
    }
    function drawCup() { const t = show(cup); $('#cup', el).textContent = (cup.l + cup.s + cup.i) ? '🥤 ' + t : '🥤 empty cup'; }
    function setEnabled(on) { el.querySelectorAll('button').forEach(b => b.disabled = !on); }
    function begin() {
      money = 0; time = 45; $('#money', el).textContent = '💰 $0'; $('#lmsg', el).textContent = '';
      setEnabled(true); newCustomer();
      iv = setInterval(() => {
        time--; $('#ltime', el).textContent = '⏱ ' + time;
        if (time <= 0) {
          clearInterval(iv); setEnabled(false);
          $('#lmsg', el).innerHTML = `Stand closed! You earned <b>$${money}</b>. <button class="btn" id="again">Open again</button>`;
          $('#again', el).addEventListener('click', begin);
        }
      }, 1000);
    }
    el.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.add; if (cup[k] < 5) cup[k]++; drawCup(); }));
    $('#dump', el).addEventListener('click', () => { cup = { l: 0, s: 0, i: 0 }; drawCup(); });
    $('#serve', el).addEventListener('click', () => {
      const ok = cup.l === order.l && cup.s === order.s && cup.i === order.i;
      if (ok) { const tip = Math.floor(rand(1, 4)); money += 2 + tip; $('#lmsg', el).textContent = `😋 Perfect! +$${2 + tip}`; }
      else { $('#lmsg', el).textContent = '😖 Blech! That\'s not what I ordered!'; }
      $('#money', el).textContent = '💰 $' + money; newCustomer();
    });
    begin();

      <canvas class="game" width="480" height="320" style="cursor:pointer"></canvas><p class="msg" id="omsg"></p>`;

    const trees = [{ x: 95, y: 120 }, { x: 240, y: 100 }, { x: 385, y: 120 }];
    const slots = [];
    trees.forEach(t => [[-45, -15], [-20, -45], [15, -50], [45, -20], [-35, 20], [0, 0], [38, 22], [-5, 40]].forEach(([dx, dy]) => slots.push({ x: t.x + dx, y: t.y + dy, s: null })));
    let score, dropped, time, over, raf, last, falling, pops, spawnT;

    function say(x, y, txt, col) { pops.push({ x, y, txt, col, t: 1 }); }
    c.addEventListener('pointerdown', e => {
      if (over) { reset(); return; }
      const p = canvasPos(c, e);
      let hit = null, bd = 22;
      for (const sl of slots) if (sl.s) { const d = Math.hypot(sl.x - p.x, sl.y + 6 - p.y); if (d < bd) { bd = d; hit = sl; } }
      if (!hit) return;
      const sp = hit.s;
      if (sp.kind === 'fork') { score = Math.max(0, score - 2); say(hit.x, hit.y, "That's a FORK! -2", '#c4182f'); hit.s = null; }

      else { const v = sp.kind === 'gold' ? 5 : 1; score += v; say(hit.x, hit.y, v === 5 ? '✨ GOLDEN +5!' : '+1 🥄', v === 5 ? '#b8860b' : '#2b1d3a'); hit.s = null; }
    });
    function drawSpoon(x, y, rot, scale, kind, phase, t) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
      const metal = kind === 'gold' ? ['#ffe27a', '#c9971a'] : phase === 'grow' ? ['#b9bcc4', '#8d9099'] : ['#ffffff', '#a9b1c2'];
      const g = ctx.createLinearGradient(-8, -20, 8, 20); g.addColorStop(0, metal[0]); g.addColorStop(1, metal[1]);
      ctx.fillStyle = g; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-2, -2, 4, 24, 2) : ctx.rect(-2, -2, 4, 24); ctx.fill(); ctx.stroke();
      if (kind === 'fork') {
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-7, -8, 14, 8, 3) : ctx.rect(-7, -8, 14, 8); ctx.fill(); ctx.stroke();
        for (let i = -6; i <= 4; i += 3.4) { ctx.beginPath(); ctx.rect(i, -20, 2.2, 13); ctx.fill(); ctx.stroke(); }
      } else { ctx.beginPath(); ctx.ellipse(0, -10, 7.5, 10.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      ctx.restore();
      if (phase === 'ripe' && kind !== 'fork') {
        ctx.fillStyle = kind === 'gold' ? '#ffd84a' : '#fff';
        const tw = (Math.sin(t / 150 + x) + 1) / 2;

      const dt = Math.min((t - last) / 1000, .05); last = t;

            const r = Math.random();

          const sp = sl.s; if (!sp) continue;
          sp.t -= dt;

        }
      }
      falling.forEach(f => { f.vy += 600 * dt; f.y += f.vy * dt; f.rot += dt * 6; });
      falling = falling.filter(f => f.y < 300);
      // scene
      const sky = ctx.createLinearGradient(0, 0, 0, 320); sky.addColorStop(0, '#9fdcff'); sky.addColorStop(1, '#e8f7ff');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, 480, 320);
      ctx.fillStyle = '#7cc46a'; ctx.fillRect(0, 240, 480, 80);
      ctx.fillStyle = '#6aae58'; for (let i = 0; i < 30; i++) ctx.fillRect((i * 67) % 480, 248 + (i * 13) % 60, 3, 7);

        ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.arc(tr.x - 20, tr.y - 25, 30, 0, Math.PI * 2); ctx.fill();
      }
      for (const sl of slots) if (sl.s) {
        const sp = sl.s, sway = Math.sin(t / 500 + sl.x) * .12;
        drawSpoon(sl.x, sl.y, sp.rot + sway, sp.phase === 'grow' ? .6 + (1 - Math.max(0, sp.t) / 2.4) * .2 : 1, sp.kind, sp.phase, t);
      }

      ctx.font = '40px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🧺', 240, 285); ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#2b1d3a'; ctx.font = 'bold 14px Trebuchet MS'; ctx.fillText(score, 240, 290);
      pops.forEach(p => { p.t -= dt; p.y -= 30 * dt; ctx.globalAlpha = Math.max(0, p.t); ctx.fillStyle = p.col; ctx.font = 'bold 15px Trebuchet MS'; ctx.fillText(p.txt, p.x, p.y - 20); ctx.globalAlpha = 1; });
      pops = pops.filter(p => p.t > 0);

  piano: { title: '🎹 The Tiny Piano (zoomed in!)', start(el) {

      player.y = Math.min(890, lastPlace.y + lastPlace.h + 34);
      if (solids().some(r => r.key !== lastPlace.key && player.x > r.x && player.x < r.x + r.w && player.y > r.y && player.y < r.y + r.h + 4)) player.y = lastPlace.y + lastPlace.h + 12;
      lastPlace = null;
    }
  }
}
$('#close').addEventListener('click', closeGame);
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeGame(); });

town.addEventListener('click', e => {
  const b = e.target.closest('[data-key]');
  if (!b) return;
  lastPlace = rectOf(b);
  openGame(b.dataset.key);
});
document.addEventListener('pointerdown', e => {
  if (!$('#modal').classList.contains('hidden')) return;
  if (e.target.closest('[data-key], #modal, .tinypiano')) return;
  launch(e.clientX, e.clientY);
});

/* ---------------- walking kid ---------------- */
const playerEl = $('#player');
const player = { x: 700, y: 748 };
const keys = {};
const rectOf = el => ({ x: parseFloat(el.style.left), y: parseFloat(el.style.top), w: parseFloat(el.style.width), h: parseFloat(el.style.height), key: el.dataset.key });
const solids = () => [...town.querySelectorAll('[data-key]')].map(rectOf).filter(r => !isNaN(r.x));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeGame(); return; }
  if (!$('#modal').classList.contains('hidden')) return;
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(k)) { keys[k] = true; e.preventDefault(); }
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => Object.keys(keys).forEach(k => keys[k] = false));
let lastT = performance.now();
(function walk(t) {
  const dt = Math.min((t - lastT) / 1000, .05); lastT = t;
  if ($('#modal').classList.contains('hidden')) {
    let dx = 0, dy = 0;
    if (keys.arrowleft || keys.a) dx -= 1;
    if (keys.arrowright || keys.d) dx += 1;
    if (keys.arrowup || keys.w) dy -= 1;
    if (keys.arrowdown || keys.s) dy += 1;
    if (dx || dy) {
      const len = Math.hypot(dx, dy), sp = 260;
      player.x = Math.max(15, Math.min(1185, player.x + dx / len * sp * dt));
      player.y = Math.max(205, Math.min(895, player.y + dy / len * sp * dt));
      if (dx) playerEl.classList.toggle('left', dx < 0);
      const hit = solids().find(r => player.x > r.x + 6 && player.x < r.x + r.w - 6 && player.y > r.y + 10 && player.y < r.y + r.h + 4);
      if (hit) { Object.keys(keys).forEach(k => keys[k] = false); lastPlace = hit; openGame(hit.key); }
    }
  } else {
    Object.keys(keys).forEach(k => keys[k] = false);
  }
  playerEl.style.left = player.x + 'px';
  playerEl.style.top = player.y + 'px';
  requestAnimationFrame(walk);
})(performance.now());
</script>
