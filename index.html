<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World — Fireworks</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #05060f;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      cursor: crosshair;
      user-select: none;
    }
    canvas { display: block; }
    #hello {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: #fff;
      text-align: center;
    }
    #hello h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 6rem);
      letter-spacing: 0.02em;
      text-shadow: 0 0 24px rgba(255,255,255,0.35);
    }
    #hello p {
      margin: 0.75rem 0 0;
      opacity: 0.6;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      transition: opacity 1s;
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div id="hello">
    <h1>Hello, World!</h1>
    <p id="hint">Click anywhere to launch fireworks</p>
  </div>

  <script>
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    let W, H, dpr;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    const rockets = [];
    const particles = [];

    class Rocket {
      constructor(tx, ty) {
        this.x = tx + (Math.random() - 0.5) * 40;
        this.y = H;
        this.tx = tx;
        this.ty = ty;
        const dist = Math.hypot(this.tx - this.x, this.ty - this.y);
        const speed = 11;
        this.vx = (this.tx - this.x) / dist * speed;
        this.vy = (this.ty - this.y) / dist * speed;
        this.hue = Math.floor(Math.random() * 360);
        this.trail = [];
      }
      update() {
        this.trail.push([this.x, this.y]);
        if (this.trail.length > 8) this.trail.shift();
        this.x += this.vx;
        this.y += this.vy;
        return this.y <= this.ty; // reached target
      }
      draw() {
        ctx.beginPath();
        const [sx, sy] = this.trail[0] || [this.x, this.y];
        ctx.moveTo(sx, sy);
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = `hsl(${this.hue}, 100%, 75%)`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    class Particle {
      constructor(x, y, hue) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.hue = hue + (Math.random() * 40 - 20);
        this.life = 1;
        this.decay = Math.random() * 0.015 + 0.01;
        this.size = Math.random() * 2 + 1;
      }
      update() {
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.vy += 0.06; // gravity
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        return this.life <= 0;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, ${50 + this.life * 30}%, ${this.life})`;
        ctx.fill();
      }
    }

    function explode(x, y, hue) {
      const count = 90 + Math.floor(Math.random() * 60);
      for (let i = 0; i < count; i++) particles.push(new Particle(x, y, hue));
    }

    function launch(e) {
      const x = e.clientX ?? (e.touches && e.touches[0].clientX);
      const y = e.clientY ?? (e.touches && e.touches[0].clientY);
      rockets.push(new Rocket(x, y));
      hint.style.opacity = 0;
    }
    canvas.addEventListener('pointerdown', launch);

    function loop() {
      // fading trail effect
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(5, 6, 15, 0.2)';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        if (r.update()) {
          explode(r.tx, r.ty, r.hue);
          rockets.splice(i, 1);
        } else {
          r.draw();
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.update()) particles.splice(i, 1);
        else p.draw();
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
